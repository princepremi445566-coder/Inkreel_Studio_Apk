name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VER_OUTPUT}"
          RAW_VERSION="$(printf '%s\n' "${JAVA_VER_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi
          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "${MAJOR_VERSION}" = "1" ]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f2)"
          fi
          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Parsed invalid Java major version: ${RAW_VERSION}"
            exit 1
          fi
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi
          echo "Verified Java major version: ${MAJOR_VERSION}"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install permanent debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64//[[:space:]]/}" ]; then
            echo "::error::Missing required GitHub repository secret DEBUG_KEYSTORE_BASE64. Generate one permanent debug keystore outside GitHub Actions and store its Base64 value in GitHub Secrets before running this workflow."
            exit 1
          fi

          ANDROID_DIR="${HOME}/.android"
          KEYSTORE_PATH="${ANDROID_DIR}/debug.keystore"
          mkdir -p "${ANDROID_DIR}"
          chmod 700 "${ANDROID_DIR}"

          if ! printf '%s' "${DEBUG_KEYSTORE_B64}" | tr -d '\r\n[:space:]' | base64 -d > "${KEYSTORE_PATH}" 2>/dev/null; then
            rm -f "${KEYSTORE_PATH}"
            echo "::error::Failed to decode DEBUG_KEYSTORE_BASE64. Ensure the secret contains valid Base64-encoded keystore data."
            exit 1
          fi
          chmod 600 "${KEYSTORE_PATH}"

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            rm -f "${KEYSTORE_PATH}"
            echo "::error::Decoded keystore at ${KEYSTORE_PATH} is missing or empty."
            exit 1
          fi

          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "${KEYTOOL_BIN}" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi
          if [ -z "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool executable not found; cannot verify permanent debug keystore."
            exit 1
          fi

          if ! LC_ALL=C "${KEYTOOL_BIN}" -list -keystore "${KEYSTORE_PATH}" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f "${KEYSTORE_PATH}"
            echo "::error::DEBUG_KEYSTORE_BASE64 is invalid or does not contain the standard debug alias/keystore password."
            exit 1
          fi

          if ! LC_ALL=C "${KEYTOOL_BIN}" -certreq -keystore "${KEYSTORE_PATH}" -storepass android -alias androiddebugkey -keypass android >/dev/null 2>&1; then
            rm -f "${KEYSTORE_PATH}"
            echo "::error::DEBUG_KEYSTORE_BASE64 key password does not match the standard debug credentials."
            exit 1
          fi

          # Provide the exact same permanent keystore at ./debug.keystore for the existing Gradle debugConfig
          cp -f "${KEYSTORE_PATH}" "./debug.keystore"
          chmod 600 "./debug.keystore"
          echo "Permanent debug keystore installed and verified at ${KEYSTORE_PATH}."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${APK_PATH}" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is empty (0 bytes)."
            exit 1
          fi
          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have a .apk extension."
            exit 1
          fi

          KEYSTORE_PATH="${HOME}/.android/debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "${KEYTOOL_BIN}" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi

          EXPECTED_CERT_SHA256="$(
            LC_ALL=C "${KEYTOOL_BIN}" -list -v -keystore "${KEYSTORE_PATH}" -storepass android -alias androiddebugkey \
              | awk -F'SHA256:' '/SHA256:/{print $2; exit}' \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if ! [[ "${EXPECTED_CERT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to extract SHA-256 certificate fingerprint from permanent debug keystore."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER_BIN="$(command -v apksigner || true)"
          if [ -z "${APKSIGNER_BIN}" ] && [ -d "${SDK_ROOT}/build-tools" ]; then
            APKSIGNER_BIN="$(find "${SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${APKSIGNER_BIN}" ] || [ ! -x "${APKSIGNER_BIN}" ]; then
            echo "::error::Android SDK apksigner tool not found; cannot verify APK signing certificate."
            exit 1
          fi

          APKSIGNER_OUT="$(LC_ALL=C "${APKSIGNER_BIN}" verify --print-certs "${APK_PATH}")"
          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "${APKSIGNER_OUT}" \
              | awk -F'SHA-256 digest:' '/SHA-256 digest:/{print $2; exit}' \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if ! [[ "${ACTUAL_CERT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to extract APK signing certificate SHA-256 digest via apksigner."
            exit 1
          fi
          if [ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::APK signing certificate mismatch with permanent debug keystore."
            exit 1
          fi

          APK_FILE_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"
          echo "apk_sha256=${APK_FILE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${ACTUAL_CERT_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "Verified debug APK: ${APK_PATH}"
          echo "Verified APK signing certificate matches permanent debug keystore."
          echo "Verified APK SHA-256: ${APK_FILE_SHA256}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TMP_DIR="$(mktemp -d)"
          ASSET_PATH="${RELEASE_TMP_DIR}/app-debug.apk"
          cp "${SOURCE_APK}" "${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy debug APK to temporary release directory."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset at ${ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          APK_SHA256: ${{ steps.verify_apk.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "::error::Prepared release asset does not exist."
            exit 1
          fi
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Prepared release asset is empty."
            exit 1
          fi
          if [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset does not end with .apk."
            exit 1
          fi
          if [ "$(basename "${ASSET_PATH}")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp)"
          cat <<EOF > "${NOTES_FILE}"
          This is an automatically generated debug APK built inside a temporary runner environment by a GitHub Actions build.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Intended Usage: Testing-only APK (not a Google Play Store production release)
          - Signing: Signed with the permanent debug signing certificate
          - APK SHA-256: ${APK_SHA256}
          EOF

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            gh release view "${RELEASE_TAG}"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk"
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- Release Tag: \`${RELEASE_TAG}\`"
              echo "- Release Title: ${RELEASE_TITLE}"
              echo "- Release Page: ${RELEASE_URL}"
              echo "- Asset Filename: \`app-debug.apk\`"
              echo "- Backup Actions Artifact: \`app-debug-apk\` remains available."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Publishing the GitHub Release failed; the permanent direct download URL is not updated for this run."
            if [ "${VERIFY_OUTCOME}" = "success" ]; then
              echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            else
              echo "APK build did not succeed."
            fi
            if [ "${UPLOAD_OUTCOME}" = "success" ]; then
              echo "Backup GitHub Actions artifact 'app-debug-apk' remains available."
            fi
            {
              echo "## GitHub Release Warning"
              echo ""
              echo "Publishing the GitHub Release failed for this run. Do not use or claim a new latest release URL from this run."
              if [ "${VERIFY_OUTCOME}" = "success" ]; then
                echo "- APK build succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)."
              fi
              if [ "${UPLOAD_OUTCOME}" = "success" ]; then
                echo "- Backup GitHub Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Clean up temporary keystore files
        if: always()
        shell: bash
        run: |
          rm -f "./debug.keystore" "${HOME}/.android/debug.keystore"
